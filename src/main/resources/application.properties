
# ==========================================================
# APLICACAO
# ==========================================================
spring.application.name=farmaura
server.port=8082

# ==========================================================
# BANCO DE DADOS H2 - PERSISTENTE EM ARQUIVO
# ==========================================================
spring.datasource.url=jdbc:h2:file:./database/farmaura;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# H2 CONSOLE    
# ==========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================================
# JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=APP

# ==========================================================
# LOGS SQL
# ==========================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================================
# UTF-8 E TERMINAL
# ==========================================================
spring.output.ansi.enabled=ALWAYS
spring.messages.encoding=UTF-8

# ==========================================================
# CONFIGURACAO PARA TESTES
# ==========================================================
spring.main.web-application-type=servlet
spring.devtools.restart.enabled=false
